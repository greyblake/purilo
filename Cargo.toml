[package]
name = "purilo"
version = "0.1.1"
edition = "2024"
authors = ["Serhii Potapov <blake131313@gmail.com>"]
description = "CLI tool to find rust projects and clean them up"
keywords = ["cli"]
license = "MIT"
repository = "https://github.com/greyblake/purilo"
homepage = "https://github.com/greyblake/purilo"
documentation = "https://docs.rs/purilo"
readme = "README.md"
categories = ["cli"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
console = "0.16.6"
ctrlc = { version = "3.5.2", features = ["termination"] }
indicatif = "0.18.6"
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
